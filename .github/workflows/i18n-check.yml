name: i18n Check

# Standalone so the translation check runs even while the general Tests
# workflow is disabled. Blocking: every locale must match English (missing or
# extra keys, empty values, placeholder errors) and may not ship untranslated
# English unless allowlisted in frontend/scripts/i18n-identical-allowlist.json.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  i18n-check:
    name: Translation consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Check translations
        run: npm run i18n:check
        working-directory: frontend

      - name: Test translation check rules
        run: npx vitest run scripts
        working-directory: frontend
