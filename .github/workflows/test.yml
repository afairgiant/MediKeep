name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # Blocking: a PR may not add a failing test. Failures already present on
      # main are listed in frontend/known-test-failures.txt (see TECHNICAL_DEBT.md).
      - name: Run tests
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=vitest-results.json
        working-directory: frontend
        continue-on-error: true

      - name: Fail on unexpected test failures
        run: node scripts/check-test-failures.js vitest-results.json
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    # TODO: Remove continue-on-error once pre-existing test failures are fixed.
    # Frontend already blocks on new failures (see known-test-failures.txt);
    # backend needs the same treatment - see TECHNICAL_DEBT.md.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests
        env:
          TESTING: 1
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///test_database.db
          SKIP_MIGRATIONS: true
          LOG_LEVEL: WARNING
        run: pytest tests/ -v --cov=app --cov-report=term-missing
